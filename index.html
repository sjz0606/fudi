<canvas id="gl" aria-hidden="true"></canvas>

<header class="top" id="top">
  <a class="brand" href="#bosh" aria-label="Фуди">
    <span class="brand-mark"><img src="assets/logo.svg" alt="" width="64" height="26"></span>
  </a>
  <nav class="nav">
    <a href="#menyu" data-t="nMenu"></a>
    <a href="#qanday" data-t="nHow"></a>
    <a href="#ofis" data-t="nOffice"></a>
    <a href="#aloqa" data-t="nContact"></a>
  </nav>
  <div class="top-r">
    <button class="lang" id="lang" type="button" data-t-aria="langAria">UZ</button>
    <a class="top-call" href="tel:+998951220044" data-t-aria="call"><svg class="ic"><use href="#i-phone"/></svg><span>95 122 00 44</span></a>
  </div>

<main>
  <!-- 1. Hero -->
  <section class="hero" id="bosh">
    <div class="wrap hero-grid">
      <div class="hero-copy">
        <p class="kicker"><svg class="ic"><use href="#i-pin"/></svg><span data-t="kicker"></span></p>
        <h1 class="h1"><span data-t="h1a"></span> <em data-t="h1b"></em></h1>
        <p class="lead" data-t="lead"></p>
        <div class="today" id="today">
          <span class="today-dot" id="todayDot"></span>
          <div><b id="todayHead"></b><span id="todayDish"></span></div>
        </div>
        <div class="acts">
          <a class="btn btn-green" href="#menyu"><span data-t="ctaMenu"></span><svg class="ic"><use href="#i-down"/></svg></a>
          <a class="btn btn-white" href="https://t.me/fudi_zakaz" target="_blank" rel="noopener"><svg class="ic"><use href="#i-tg"/></svg><span data-t="ctaTg"></span></a>
        </div>
      </div>
      <div class="hero-stage">
        <div class="slot slot-hero" data-slot="hero">
          <img class="fallback" src="assets/p/3426_2.webp" alt="" id="fbHero">
        </div>
        <ul class="anatomy" aria-label="Состав сета">
          <li><svg class="ic"><use href="#i-plate"/></svg><span data-t="aDish"></span></li>
          <li id="aSide"><svg class="ic"><use href="#i-bowl"/></svg><span data-t="aSalad"></span></li>
          <li><svg class="ic"><use href="#i-cup"/></svg><span data-t="aCompot"></span></li>
          <li><svg class="ic"><use href="#i-bread"/></svg><span data-t="aBread"></span></li>
        </ul>
      </div>
    </div>
    <div class="wrap facts">
      <div class="fact"><b>40 000</b><span data-t="f1"></span></div>
      <div class="fact"><b>20 000</b><span data-t="f2"></span></div>
      <div class="fact"><svg class="ic"><use href="#i-qr"/></svg><span data-t="f3"></span></div>
      <div class="fact"><svg class="ic"><use href="#i-clock"/></svg><span data-t="f4"></span></div>
    </div>
  </section>

  <!-- 2. Menyu -->
  <section class="menu" id="menyu">
    <div class="wrap">
      <div class="sec-head">
        <p class="eyebrow" data-t="mEye"></p>
        <h2 class="h2" data-t="mTitle"></h2>
        <p class="sec-sub" data-t="mSub"></p>
      </div>
      <div class="days" role="tablist" id="days"></div>
      <div class="menu-grid">
        <div class="menu-stage">
          <div class="slot slot-menu" data-slot="menu"><img class="fallback" src="assets/p/3426_2.webp" alt="" id="fbMenu"></div>
          <div class="pick" id="pick">
            <p class="pick-k" data-t="pickK"></p>
            <h3 id="pickName"></h3>
            <p id="pickDesc"></p>
            <p class="pick-comp" id="pickComp"></p>
          </div>
        </div>
        <div class="menu-list">
          <ol class="sets" id="sets"></ol>
          <h3 class="always-h"><svg class="ic"><use href="#i-check"/></svg><span data-t="always"></span></h3>
          <ol class="sets" id="always"></ol>
          <p class="menu-note"><svg class="ic"><use href="#i-tg"/></svg><span data-t="mNote"></span> <a href="https://t.me/fudi_uz" target="_blank" rel="noopener">t.me/fudi_uz</a></p>
        </div>
      </div>
    </div>
  </section>

  <!-- 3. Qanday buyurtma -->
  <section class="how" id="qanday">
    <div class="wrap">
      <div class="sec-head">
        <p class="eyebrow" data-t="hEye"></p>
        <h2 class="h2" data-t="hTitle"></h2>
      </div>
      <ol class="steps">
        <li><span class="st-n">1</span><svg class="ic"><use href="#i-cal"/></svg><h3 data-t="s1h"></h3><p data-t="s1p"></p></li>
        <li><span class="st-n">2</span><svg class="ic"><use href="#i-tg"/></svg><h3 data-t="s2h"></h3><p data-t="s2p"></p></li>
        <li><span class="st-n">3</span><svg class="ic"><use href="#i-van"/></svg><h3 data-t="s3h"></h3><p data-t="s3p"></p></li>
      </ol>
    </div>
  </section>

  <!-- 4. Ofis uchun -->
  <section class="office" id="ofis">
    <div class="wrap office-head">
      <div>
        <p class="eyebrow" data-t="oEye"></p>
        <h2 class="h2" data-t="oTitle"></h2>
      </div>
      <p class="sec-sub" data-t="oSub"></p>
    </div>
    <div class="reel" id="reel" tabindex="0" aria-label="Фото заказов"></div>
  </section>

  <!-- 5. Aloqa -->
  <section class="contact" id="aloqa">
    <div class="wrap contact-grid">
      <div>
        <img class="c-logo" src="assets/logo.svg" alt="Фуди" width="200" height="80">
        <h2 class="h2" data-t="cTitle"></h2>
        <p class="sec-sub" data-t="cSub"></p>
        <div class="acts">
          <a class="btn btn-orange" href="https://t.me/fudi_zakaz" target="_blank" rel="noopener"><svg class="ic"><use href="#i-tg"/></svg><span>@fudi_zakaz</span></a>
          <a class="btn btn-line" href="tel:+998951220044"><svg class="ic"><use href="#i-phone"/></svg><span>+998 95 122 00 44</span></a>
        </div>
      </div>
      <ul class="c-list">
        <li><svg class="ic"><use href="#i-clock"/></svg><div><b data-t="cHoursK"></b><span data-t="cHours"></span></div></li>
        <li><svg class="ic"><use href="#i-van"/></svg><div><b data-t="cDelK"></b><span data-t="cDel"></span></div></li>
        <li><svg class="ic"><use href="#i-qr"/></svg><div><b data-t="cPayK"></b><span data-t="cPay"></span></div></li>
        <li><svg class="ic"><use href="#i-tg"/></svg><div><b data-t="cChanK"></b><a href="https://t.me/fudi_uz" target="_blank" rel="noopener">t.me/fudi_uz</a></div></li>
        <li><svg class="ic"><use href="#i-ig"/></svg><div><b>Instagram</b><a href="https://instagram.com/fudi_uz" target="_blank" rel="noopener">@fudi_uz</a></div></li>
      </ul>
    </div>
    <footer class="wrap foot"><span>© <span id="yr"></span> <span data-t="brandName"></span> · <span data-t="city"></span></span><span data-t="slogan"></span></footer>
  </section>
</main>

<!-- Savat paneli -->
<div class="cart" id="cart" hidden>
  <div class="cart-in">
    <div class="cart-sum"><b id="cartCount"></b><span id="cartTotal"></span></div>
    <button class="btn btn-green" id="cartGo" type="button"><span data-t="cartGo"></span><svg class="ic"><use href="#i-arrow"/></svg></button>
  </div>
</div>

<!-- Buyurtma oynasi -->
<dialog class="sheet" id="sheet">
  <form method="dialog" class="sheet-in" id="orderForm" novalidate>
    <button class="sheet-x" value="cancel" type="button" id="sheetX" data-t-aria="close"><svg class="ic"><use href="#i-x"/></svg></button>
    <h2 data-t="oFormT"></h2>
    <ul class="sheet-lines" id="sheetLines"></ul>
    <div class="sheet-total" id="sheetTotal"></div>
    <label><span data-t="fName"></span><input name="name" autocomplete="name" data-ph="phName" required></label>
    <label><span data-t="fPhone"></span><input name="phone" type="tel" autocomplete="tel" inputmode="tel" data-ph="phPhone" required></label>
    <label><span data-t="fAddr"></span><input name="addr" autocomplete="street-address" data-ph="phAddr" required></label>
    <div class="row2">
      <label><span data-t="fDay"></span><input name="day" id="fDay" readonly tabindex="-1"></label>
      <label><span data-t="fTime"></span><select name="time" id="fTime"></select></label>
    </div>
    <label><span data-t="fNote"></span><input name="note" data-ph="phNote"></label>
    <p class="sheet-err" id="sheetErr" hidden data-t="fErr"></p>
    <button class="btn btn-green btn-full" type="submit"><svg class="ic"><use href="#i-tg"/></svg><span data-t="fSend"></span></button>
    <p class="sheet-hint" data-t="fHint"></p>
  </form>
  <div class="sheet-done" id="sheetDone" hidden>
    <span class="done-ic"><svg class="ic"><use href="#i-check"/></svg></span>
    <h2 data-t="dT"></h2>
    <p data-t="dP"></p>
    <a class="btn btn-green" id="doneTg" href="https://t.me/fudi_zakaz" target="_blank" rel="noopener"><svg class="ic"><use href="#i-tg"/></svg><span data-t="dBtn"></span></a>
    <a class="btn btn-line-dark" href="tel:+998951220044"><svg class="ic"><use href="#i-phone"/></svg><span>+998 95 122 00 44</span></a>
  </div>
</dialog>

<script type="module" src="js/site.js"></script>
